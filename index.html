<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix D3 Dashboard</title>
    <script src="https://unpkg.com/topojson@3"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Netflix Dashboard</h1>
    <p>Interactive analysis of netflix content</p>
</header>

<!-- FILTERI -->
<div class="controls">

    <label>Genre:</label>
    <select id="genreFilter">
        <option value="All">All</option>
    </select>

    <!-- country se dodaje JS-om -->
</div>

<!-- DASHBOARD -->
<div class="dashboard">

    <div class="card">
        <h2>Top Genres</h2>
        <svg id="barChart"></svg>
    </div>

    <div class="card">
        <h2>Movies vs TV Shows</h2>
        <svg id="pieChart"></svg>
    </div>

    <div class="card full-width">
        <h2>Releases Through Years</h2>
        <svg id="lineChart"></svg>
    </div>
    <div class="card full-width">
    <h2>Netflix content per countries</h2>
    <svg id="worldMap"></svg>
</div>

</div>

<div id="tooltip"></div>

<script src="script.js"></script>

</body>
</html>
